<svg width="100%" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<!-- Background -->
<rect x="0" y="0" width="680" height="340" rx="12" fill="rgb(13, 17, 23)"/>

<!-- Grid lines -->
<line x1="40" y1="0" x2="40" y2="340" stroke="rgb(29, 158, 117)" stroke-width="0.4" opacity="0.25"/>
<line x1="120" y1="0" x2="120" y2="340" stroke="rgb(29, 158, 117)" stroke-width="0.4" opacity="0.25"/>
<line x1="200" y1="0" x2="200" y2="340" stroke="rgb(29, 158, 117)" stroke-width="0.4" opacity="0.25"/>
<line x1="560" y1="0" x2="560" y2="340" stroke="rgb(29, 158, 117)" stroke-width="0.4" opacity="0.25"/>
<line x1="640" y1="0" x2="640" y2="340" stroke="rgb(29, 158, 117)" stroke-width="0.4" opacity="0.25"/>
<line x1="0" y1="60" x2="680" y2="60" stroke="rgb(29, 158, 117)" stroke-width="0.4" opacity="0.25"/>
<line x1="0" y1="280" x2="680" y2="280" stroke="rgb(29, 158, 117)" stroke-width="0.4" opacity="0.25"/>

<!-- Hexagon icon — same shape as P1 -->
<polygon points="130,60 190,85 190,155 130,185 70,155 70,85" fill="rgb(29, 158, 117)" opacity="0.9"/>
<polygon points="130,72 178,93 178,150 130,176 82,150 82,93" fill="rgb(13, 17, 23)"/>
<polygon points="130,88 162,103 162,142 130,158 98,142 98,103" fill="rgb(29, 158, 117)" opacity="0.12"/>

<!-- Segmentation icon inside hexagon: three zones (WAN/LAN/DMZ) meeting at a firewall, one path blocked -->
<!-- Firewall block, center -->
<rect x="121" y="107" width="18" height="26" rx="2" fill="rgb(55, 138, 221)" opacity="0.85"/>
<line x1="125" y1="113" x2="135" y2="113" stroke="rgb(13, 17, 23)" stroke-width="1.2" opacity="0.8"/>
<line x1="125" y1="119" x2="135" y2="119" stroke="rgb(13, 17, 23)" stroke-width="1.2" opacity="0.8"/>
<line x1="125" y1="125" x2="135" y2="125" stroke="rgb(13, 17, 23)" stroke-width="1.2" opacity="0.8"/>

<!-- WAN node (top) — allowed link -->
<circle cx="130" cy="90" r="4" fill="rgb(239, 159, 39)" opacity="0.9"/>
<line x1="130" y1="94" x2="130" y2="107" stroke="rgb(29, 158, 117)" stroke-width="1.5" opacity="0.85"/>

<!-- LAN node (bottom-left) — allowed link -->
<circle cx="106" cy="150" r="4" fill="rgb(55, 138, 221)" opacity="0.9"/>
<line x1="109" y1="147" x2="123" y2="130" stroke="rgb(29, 158, 117)" stroke-width="1.5" opacity="0.85"/>

<!-- DMZ node (bottom-right) — blocked link -->
<circle cx="154" cy="150" r="4" fill="rgb(224, 82, 82)" opacity="0.9"/>
<line x1="151" y1="147" x2="137" y2="130" stroke="rgb(224, 82, 82)" stroke-width="1.5" opacity="0.85"/>
<line x1="141" y1="136" x2="147" y2="142" stroke="rgb(224, 82, 82)" stroke-width="1.8" opacity="0.95"/>
<line x1="147" y1="136" x2="141" y2="142" stroke="rgb(224, 82, 82)" stroke-width="1.8" opacity="0.95"/>

<!-- Main title -->
<text x="220" y="120" font-family="monospace" font-size="13" font-weight="400" fill="rgb(29, 158, 117)" opacity="0.7">P2 — NETWORK SEGMENTATION &amp; IDS/IPS</text>
<text x="220" y="150" font-family="monospace" font-size="28" font-weight="700" fill="rgb(255, 255, 255)">LOGISECURE</text>
<text x="220" y="180" font-family="monospace" font-size="26" font-weight="700" fill="rgb(29, 158, 117)">PFSENSE HARDENING</text>

<!-- Subtitle -->
<text x="222" y="205" font-family="monospace" font-size="12" font-weight="400" fill="rgb(29, 158, 117)">pfSense CE 2.7.2 · WAN/LAN/DMZ · Suricata · 12 firewall rules</text>

<!-- Badges -->
<rect x="220" y="215" width="58" height="18" rx="3" fill="rgb(180, 100, 220)" opacity="0.15"/>
<rect x="284" y="215" width="66" height="18" rx="3" fill="rgb(29, 158, 117)" opacity="0.15"/>
<rect x="356" y="215" width="58" height="18" rx="3" fill="rgb(239, 159, 39)" opacity="0.15"/>
<rect x="420" y="215" width="34" height="18" rx="3" fill="rgb(55, 138, 221)" opacity="0.15"/>
<rect x="460" y="215" width="68" height="18" rx="3" fill="rgb(139, 92, 246)" opacity="0.15"/>

<text x="224" y="228" font-family="monospace" font-size="10" fill="rgb(180, 100, 220)">pfSense</text>
<text x="288" y="228" font-family="monospace" font-size="10" fill="rgb(29, 158, 117)">Suricata</text>
<text x="360" y="228" font-family="monospace" font-size="10" fill="rgb(239, 159, 39)">ISO 27001</text>
<text x="424" y="228" font-family="monospace" font-size="10" fill="rgb(55, 138, 221)">NIS2</text>
<text x="464" y="228" font-family="monospace" font-size="10" fill="rgb(139, 92, 246)">VirtualBox</text>

<!-- Author -->
<text x="220" y="258" font-family="monospace" font-size="10" fill="rgb(255, 255, 255)" opacity="0.6">Maxime Belliard</text>
<text x="220" y="272" font-family="monospace" font-size="10" fill="rgb(255, 255, 255)" opacity="0.8">github.com/MaxBell10</text>

