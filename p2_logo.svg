<line x1="600" y1="80" x2="590" y2="140" stroke="rgb(55, 138, 221)" stroke-width="0.8" opacity="0.4"/>
<line x1="590" y1="140" x2="580" y2="200" stroke="rgb(55, 138, 221)" stroke-width="0.8" opacity="0.4"/>
<line x1="615" y1="120" x2="605" y2="170" stroke="rgb(55, 138, 221)" stroke-width="0.8" opacity="0.4"/>
<line x1="635" y1="190" x2="655" y2="220" stroke="rgb(55, 138, 221)" stroke-width="0.8" opacity="0.4"/>
<line x1="605" y1="170" x2="580" y2="200" stroke="rgb(55, 138, 221)" stroke-width="0.8" opacity="0.4"/>

